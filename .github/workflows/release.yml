name: release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm run build

      - id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    if: github.event_name == 'push' && needs.verify.outputs.exists == 'false'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Preparar o projeto Android
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
          npm run icons

      - name: Compilar o app
        working-directory: android
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > release.keystore
            ./gradlew --no-daemon assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            rm -f release.keystore
          else
            echo "::notice::Sem keystore configurado: sai um APK de teste assinado com a chave de debug."
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Reunir os artefatos
        id: artifacts
        run: |
          mkdir -p dist
          find android/app/build/outputs \( -name '*.apk' -o -name '*.aab' \) -type f | while read -r file; do
            case "$file" in
              *release*) label="$TAG" ;;
              *) label="$TAG-teste" ;;
            esac
            cp "$file" "dist/politicamais-$label.${file##*.}"
          done
          {
            echo 'checksums<<CHECKSUMS'
            (cd dist && sha256sum ./* | sed 's|\./||')
            echo 'CHECKSUMS'
          } >> "$GITHUB_OUTPUT"

      - name: Publicar a versão
        run: |
          cat > notes.md <<'HEADER'
          ## Como instalar

          Baixe o `.apk` abaixo, abra no aparelho e autorize a instalação de fonte desconhecida.
          O `.aab` serve apenas para envio à Play Store.

          Confira o arquivo antes de instalar comparando o SHA-256:

          ```
          HEADER
          printf '%s\n' "${{ steps.artifacts.outputs.checksums }}" >> notes.md
          printf '```\n\n' >> notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes dist/*

  data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run data:fetch
      - run: npm run check

      - name: Commitar o snapshot de rotas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --staged --quiet; then
            echo "::notice::Nenhuma mudança no snapshot."
          else
            git commit -m "data: atualiza o snapshot de parlamentares"
            git push
          fi
